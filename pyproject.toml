[project]
name = "membrane-breakout-3d"
version = "0.1.0"
description = "A physics-based 3D Breakout game with an elastic membrane paddle and verification scripts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pygame>=2.6",
    "membrane-rl",
]

[project.optional-dependencies]
analysis = [
    "plotly>=5.0",
]
agent = [
    "membrane-rl[agent]",
]
debug = [
    "membrane-rl[debug]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "plotly>=5",   # membrane-rl debug view tests
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["membrane-rl"]

[tool.uv.sources]
membrane-rl = { workspace = true }
